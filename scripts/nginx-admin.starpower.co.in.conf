# admin.starpower.co.in — static build only. Never proxy to a dev server (vite) here.
server {
    server_name admin.starpower.co.in;

    root  /var/www/starpower-admin;
    index index.html;

    server_tokens off;
    client_max_body_size 16k;

    # Static site: only reads are allowed.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Let's Encrypt renewals.
    location ^~ /.well-known/acme-challenge/ { allow all; }

    # Hidden files (.env, .git, ...), source/config files and Vite dev-server paths never exist here.
    location ~ /\.          { return 404; }
    location ~* \.(map|ts|tsx|json|env|log|bak|sh|yml|yaml|md)$ { return 404; }
    location ~ ^/(@|node_modules/|src/) { return 404; }

    location /assets/ {
        include snippets/admin-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include snippets/admin-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.starpower.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.starpower.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.starpower.co.in;
    return 301 https://$host$request_uri;
}
